name: Test bot Pokemon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliotheques
        run: pip install requests beautifulsoup4

      - name: Lancer le bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Sauvegarder les produits detectes
        run: |
          git config user.name "pokemon30-bot"
          git config user.email "pokemon30-bot@users.noreply.github.com"
          git add seen_products.json
          git diff --cached --quiet || git commit -m "Mise a jour produits Playin"
          git push